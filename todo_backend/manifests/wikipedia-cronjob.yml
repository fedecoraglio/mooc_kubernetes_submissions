apiVersion: v1
kind: ConfigMap
metadata:
  name: wikipedia-todo-config
  namespace: project
data:
  WIKIPEDIA_URL: "https://en.wikipedia.org/wiki/Special:Random"
  TODO_API_URL: "http://todo-backend-svc:2345/todos"
  TODO_MAX_LENGTH: "140"

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wikipedia-todo
  namespace: project
spec:
  schedule: "0 * * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: wikipedia-todo
              image: node:22-alpine
              envFrom:
                - configMapRef:
                    name: wikipedia-todo-config
              command: ["node", "-e"]
              args:
                - |
                  async function run() {
                    const wiki = process.env.WIKIPEDIA_URL;
                    const api = process.env.TODO_API_URL;
                    const maxLength = Number(process.env.TODO_MAX_LENGTH);

                    // Retry if a random article has a very long URL
                    for (let attempt = 0; attempt < 10; attempt++) {
                      const response = await fetch(wiki, {
                        redirect: 'manual',
                        signal: AbortSignal.timeout(10000)
                      });

                      if (![301, 302, 303, 307, 308].includes(response.status)) {
                        throw new Error(`Wikipedia returned ${response.status}`);
                      }

                      const location = response.headers.get('location');
                      if (!location) {
                        throw new Error('Missing Location header');
                      }

                      const url = new URL(location, wiki);

                      if (url.protocol !== 'https:' ||
                          url.hostname !== 'en.wikipedia.org') {
                        throw new Error('Unexpected redirect URL');
                      }

                      const text = `Read ${url.toString()}`;

                      if (text.length > maxLength) {
                        console.log('URL too long, trying another article');
                        continue;
                      }

                      const created = await fetch(api, {
                        method: 'POST',
                        headers: {
                          'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ text }),
                        signal: AbortSignal.timeout(10000)
                      });

                      if (created.status !== 201) {
                        throw new Error(
                          `Todo backend returned ${created.status}`
                        );
                      }

                      console.log(`Created todo: ${text}`);
                      return;
                    }

                    throw new Error('Could not find a short enough URL');
                  }

                  run().catch(error => {
                    console.error(error);
                    process.exit(1);
                  });
