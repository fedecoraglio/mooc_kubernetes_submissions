
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3d-k3s-default-agent-0
      containers:
        - name: writer
          image: log-output:1.3
          imagePullPolicy: IfNotPresent
          command: ["node", "writer.js"]
          volumeMounts:
            - name: shared-data
              mountPath: /shared

        - name: reader
          image: log-output:1.3
          imagePullPolicy: IfNotPresent
          command: ["node", "reader.js"]
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: shared-data
              mountPath: /shared
            - name: persistent-data
              mountPath: /data
              readOnly: true

      volumes:
        - name: shared-data
          emptyDir: {}
        - name: persistent-data
          persistentVolumeClaim:
            claimName: shared-pvc
